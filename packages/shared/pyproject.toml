[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate-shared"
version = "0.1.0"
description = "Shared contract types for AgentGate (Python side)."
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0"]

[tool.setuptools]
packages = ["agentgate_shared"]

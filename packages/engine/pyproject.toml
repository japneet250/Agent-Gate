[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate-engine"
version = "0.1.0"
description = "AgentGate evaluation engine — the LLM-as-judge slow path."
requires-python = ">=3.10"
dependencies = [
  "agentgate-shared",
  "langgraph>=0.2",
  "langchain-openai>=0.2",
  "openai>=1.40",
  "pydantic>=2.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "langfuse>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
packages = ["agentgate_engine", "agentgate_engine.nodes"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
